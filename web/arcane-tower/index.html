<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>아케인 타워</title>
<style>
/* 레이아웃: 480x270 픽셀 캔버스를 화면 중앙에 정수배로 확대, 그 위에 DOM HUD를 겹친다 */
:root{color-scheme:dark;--bg:#07060d;--panel:#191530;--panel2:#241e44;--line:#4b3f86;--text:#ece8ff;--dim:#9b93c4;--gold:#ffd84a;--hp:#e5484d;--mp:#3b82f6;--xp:#5ed36b;--accent:#a45cf0;--no:#ff6b6b;--ink:#0d0a1a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:"DungGeunMo","Galmuri11","NeoDunggeunmo","Malgun Gothic","Apple SD Gothic Neo",ui-monospace,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;font-size:8px;--px:2px;box-shadow:0 0 0 2px #2a2350,0 0 60px #000;background:#000}
#game{width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated;cursor:crosshair}
#scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0) 50%,rgba(0,0,0,.26) 50%);background-size:100% var(--px);box-shadow:inset 0 0 12em 2em rgba(0,0,0,.55)}
#scan.off{display:none}
#ui{position:absolute;inset:0;pointer-events:none;text-shadow:.12em .12em 0 #000}
img.ic{image-rendering:pixelated;height:1.25em;vertical-align:-.25em;margin-right:.2em}
img.ic.big{height:6em;float:left;margin:0 1em .4em 0}
#bars{position:absolute;left:1.5em;top:1.5em;width:34em}
.who{font-size:1.7em;margin-bottom:.35em}.who span{color:var(--gold)}
.bar{position:relative;height:2.1em;background:#120f22;box-shadow:0 0 0 .25em #2e2757;margin-bottom:.75em}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;box-shadow:inset 0 -.5em 0 rgba(0,0,0,.28),inset 0 .35em 0 rgba(255,255,255,.25)}
.bar span{position:absolute;inset:0;font-size:1.35em;line-height:1.55em;text-align:center}
.bar.hp i{background:var(--hp)}.bar.mp i{background:var(--mp)}.bar.xp{height:1.1em}.bar.xp i{background:var(--xp)}
#res{position:absolute;right:1.5em;top:1.5em;text-align:right;font-size:1.6em;line-height:1.5}
#res b{color:var(--gold);font-weight:normal}
#floorInfo{position:absolute;left:50%;top:1.2em;transform:translateX(-50%);font-size:1.7em;text-align:center;white-space:nowrap}
#bossBar{position:absolute;left:50%;top:5em;transform:translateX(-50%);width:44em;text-align:center}
#bossBar .bar i{background:#c04cff}#bossName{font-size:1.6em;color:#ffb3ff}
#menuBtns{position:absolute;right:1.5em;top:13.5em;display:flex;gap:.6em;pointer-events:auto}
button{font-family:inherit;font-size:1.45em;color:var(--text);background:var(--panel2);border:0;box-shadow:0 0 0 .18em var(--line),0 .3em 0 .18em #0b0818;padding:.35em .7em;cursor:pointer;text-shadow:inherit}
button:hover{background:#34297a}button:active{transform:translateY(.15em)}
button:focus-visible{outline:.15em solid var(--gold)}
button.off,button:disabled{opacity:.45}
button.go{background:#6a38c9}button.go:hover{background:#8250e6}
#skills{position:absolute;left:50%;bottom:1.5em;transform:translateX(-50%);display:flex;gap:.9em;pointer-events:auto}
.sk{width:7.5em;height:7.5em;position:relative;background:var(--panel);box-shadow:0 0 0 .4em var(--line);cursor:pointer;overflow:hidden}
.sk.gap{margin-left:1.4em}
.sk img{width:100%;height:100%;image-rendering:pixelated;display:block}
.sk .cdm{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(8,6,20,.78)}
.sk .key{position:absolute;left:.25em;top:.1em;font-size:1.3em;color:var(--gold)}
.sk .cnt{position:absolute;right:.25em;bottom:.05em;font-size:1.3em}
.sk.nomp img{filter:grayscale(1) brightness(.6)}
.sk.empty{opacity:.4;cursor:default}
#toasts{position:absolute;left:1.5em;bottom:11em;display:flex;flex-direction:column-reverse;gap:.4em;font-size:1.5em}
#toasts div{background:rgba(13,10,26,.82);padding:.25em .6em;box-shadow:0 0 0 .12em var(--line);animation:tin .2s steps(3)}
@keyframes tin{from{transform:translateX(-2em);opacity:0}}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:4.6em;color:var(--gold);text-shadow:.1em .1em 0 #000,-.06em -.06em 0 #63309e;opacity:0;transition:opacity .25s steps(4)}
#banner small{display:block;font-size:.42em;color:var(--text)}
#banner.on{opacity:1}
#labels div{position:absolute;transform:translate(-50%,-100%);font-size:1.4em;white-space:nowrap;text-align:center;line-height:1.25}
#labels .pr{color:var(--gold);display:none}#labels .near .pr{display:block}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s steps(5)}#fade.on{opacity:1}
#panel{position:absolute;inset:0;background:rgba(5,4,12,.6);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#panelBox{width:78%;max-height:88%;background:var(--panel);box-shadow:0 0 0 .5em var(--ink),0 0 0 .9em var(--line),0 0 0 1.3em var(--ink);display:flex;flex-direction:column}
#panelHead{display:flex;justify-content:space-between;align-items:center;padding:.9em 1.4em;background:var(--panel2);font-size:1.1em}
#panelTitle{font-size:1.9em;color:var(--gold)}
#panelBody{padding:1.2em 1.6em;overflow-y:auto;font-size:1.5em;line-height:1.5}
#panelBody button{font-size:1em}
#panelBody p{margin:.2em 0 .8em;color:var(--dim)}
.npc{min-height:6.4em}.row{margin:.5em 0}.gold{color:var(--gold)}.no{color:var(--no)}.dim{color:var(--dim)}
.card{background:var(--panel2);padding:.6em .8em;margin:.6em 0;box-shadow:0 0 0 .12em var(--line);display:flex;gap:.8em;align-items:center}
.card>.gr{flex:1;min-width:0}.card img.ci{width:3.2em;height:3.2em;image-rendering:pixelated;flex:none}
.tabs{display:flex;gap:.5em;margin-bottom:.8em}.tabs button.on{background:#6a38c9}
.inv{display:grid;grid-template-columns:repeat(8,1fr);gap:.45em}
.cell{aspect-ratio:1;background:var(--ink);box-shadow:0 0 0 .14em #3a3168;position:relative;cursor:pointer}
.cell img{width:100%;height:100%;image-rendering:pixelated;display:block}
.cell u{position:absolute;right:.1em;bottom:0;font-size:.8em;text-decoration:none}
.cell.sel{box-shadow:0 0 0 .22em #fff}
.two{display:flex;gap:1.2em}.two>div{flex:1;min-width:0}
.eqs{display:flex;gap:.6em;margin-bottom:.8em}.eqs .cell{width:3.6em;flex:none}
.statrow{display:flex;justify-content:space-between;align-items:center;margin:.35em 0}
#title{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a1c5e 0,#0b0818 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6em;pointer-events:auto;text-align:center}
#title h1{font-size:7em;margin:0;color:var(--gold);text-shadow:.08em .08em 0 #63309e,.16em .16em 0 #000;letter-spacing:.06em}
#title h2{font-size:1.9em;margin:0;color:var(--dim);font-weight:normal}
#title .keys{font-size:1.45em;color:var(--dim);line-height:1.7}
#title .keys b{color:var(--text);font-weight:normal}
#title button{font-size:2.2em;padding:.4em 1.4em}
#titleArt{image-rendering:pixelated;width:22em;height:11em}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch button{position:absolute;pointer-events:auto;width:5.2em;height:5.2em;border-radius:50%;font-size:1.6em;opacity:.8}
#tF{right:2em;bottom:9em}#tB{right:9em;bottom:7em}
#joy{position:absolute;width:14em;height:14em;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:0 0 0 .3em rgba(255,255,255,.2);display:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:6em;height:6em;margin:-3em;border-radius:50%;background:rgba(255,255,255,.3)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="scan"></div>
  <div id="ui">
    <div id="labels"></div>
    <div id="hud" hidden>
      <div id="bars">
        <div class="who"><b id="lvl">Lv.1</b> <span id="circ">1서클</span></div>
        <div class="bar hp"><i id="hpF"></i><span id="hpT"></span></div>
        <div class="bar mp"><i id="mpF"></i><span id="mpT"></span></div>
        <div class="bar xp"><i id="xpF"></i></div>
      </div>
      <div id="floorInfo"></div>
      <div id="bossBar" hidden><div id="bossName"></div><div class="bar"><i id="bossF"></i></div></div>
      <div id="res"></div>
      <div id="menuBtns"><button id="bBag">가방[Tab]</button><button id="bScan">CRT</button><button id="bSnd">소리</button></div>
      <div id="skills"></div>
      <div id="toasts"></div>
      <div id="banner"></div>
      <div id="touch"><div id="joy"><i id="joyK"></i></div><button id="tF">F</button><button id="tB">블링크</button></div>
    </div>
    <div id="panel" hidden><div id="panelBox"><div id="panelHead"><span id="panelTitle"></span><button id="panelX">닫기 ✕</button></div><div id="panelBody"></div></div></div>
    <div id="fade"></div>
    <div id="title">
      <canvas id="titleArt" width="88" height="44"></canvas>
      <h1>아케인 타워</h1>
      <h2>심연의 탑을 오르는 마법사 육성 RPG</h2>
      <div><button id="bCont" class="go" hidden>이어하기</button> <button id="bNew" class="go">새로 시작</button></div>
      <div class="keys"><b>WASD</b> 이동 · <b>마우스</b> 조준 / <b>좌클릭</b> 매직 미사일 · <b>1~6</b> 마법 · <b>Space</b> 블링크<br><b>F</b> 대화·포탈 · <b>Q</b> 체력 물약 · <b>E</b> 마나 물약 · <b>Tab</b> 캐릭터/가방 · <b>L</b> CRT · <b>M</b> 소리</div>
    </div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   아케인 타워 — 단일 파일 16비트풍 마법사 RPG
   외부 에셋 없음: 모든 그림은 픽셀 그리드 → OffscreenCanvas, 모든 소리는 Web Audio 합성
   ===================================================================== */
const W=480,H=270;
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mkC=(w,h)=>{if(typeof OffscreenCanvas!=='undefined')return new OffscreenCanvas(w,h);const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const g2=c=>{const g=c.getContext('2d');g.imageSmoothingEnabled=false;return g};

/* ============================ AUDIO ============================ */
const AU={ctx:null};
function initAudio(){
  if(AU.ctx){AU.ctx.resume&&AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  let c;try{c=AU.ctx=new C()}catch(e){return}
  AU.master=c.createGain();AU.master.gain.value=S.mute?0:.8;AU.master.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.42;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.6;AU.sfx.connect(AU.master);
  const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
  setInterval(schedule,30);
}
function _tone(type,f0,f1,dur,vol,t,dest){
  const c=AU.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.02);
}
function _noiz(dur,vol,f0,f1,t,dest,type){
  const c=AU.ctx;if(!c)return;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;s.loop=true;f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t,Math.random());s.stop(t+dur+.02);
}
const tone=(ty,f0,f1,d,v,w=0)=>AU.ctx&&_tone(ty,f0,f1,d,v,AU.ctx.currentTime+w);
const noiz=(d,v,f0,f1,w=0,ty)=>AU.ctx&&_noiz(d,v,f0,f1,AU.ctx.currentTime+w,null,ty);
let lastHitS=0;
const sfx={
  shoot(){tone('square',920,480,.07,.06)},
  hit(){const n=performance.now();if(n-lastHitS<45)return;lastHitS=n;noiz(.05,.16,3000,800);tone('square',220,110,.05,.05)},
  crit(){const n=performance.now();if(n-lastHitS<45)return;lastHitS=n;noiz(.08,.24,5000,900);tone('square',660,1320,.09,.07)},
  fire(){noiz(.25,.2,400,2400);tone('sawtooth',300,120,.2,.07)},
  boom(){noiz(.45,.45,1800,80);tone('sine',120,30,.4,.45)},
  bigboom(){noiz(.9,.7,2500,50);tone('sine',90,22,.8,.7);tone('square',60,30,.5,.12)},
  zap(){noiz(.18,.3,8000,3000,0,'highpass');tone('sawtooth',1800,200,.16,.09);tone('square',2400,300,.1,.05,.03)},
  frost(){tone('sine',2000,500,.4,.12);tone('triangle',3000,1200,.3,.07,.05);noiz(.3,.12,9000,5000,0,'highpass')},
  meteor(){tone('sawtooth',1000,90,.9,.07);tone('square',1500,140,.9,.03)},
  hole(){tone('sine',60,220,1.2,.3);tone('sawtooth',40,90,1.2,.07)},
  apoc(){tone('sawtooth',55,110,1.5,.2);tone('square',220,55,1.5,.07);noiz(1.5,.25,200,3000)},
  coin(){tone('square',988,988,.06,.07);tone('square',1319,1319,.12,.07,.06)},
  gem(){tone('triangle',1200+rnd(400),1900,.06,.06)},
  hurt(){tone('sawtooth',300,80,.2,.2);noiz(.12,.2,1500,300)},
  lvl(){[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,f,.14,.09,i*.08))},
  ui(){tone('square',660,880,.05,.05)},
  err(){tone('square',160,120,.12,.07)},
  buy(){tone('square',784,784,.07,.07);tone('square',1175,1175,.14,.07,.07)},
  portal(){tone('sine',200,1200,.6,.15);tone('triangle',400,2400,.6,.06)},
  blink(){tone('sine',1400,300,.12,.1)},
  die(){[440,370,311,220,147].forEach((f,i)=>tone('sawtooth',f,f*.9,.25,.12,i*.16))},
  clear(){[659,784,988,1319,988,1319,1568].forEach((f,i)=>tone('square',f,f,.12,.09,i*.09))},
  potion(){tone('sine',400,900,.2,.12)},
  spawn(){tone('triangle',150,400,.25,.05)},
  item(){tone('triangle',1047,1047,.1,.1);tone('triangle',1568,1568,.2,.1,.1)},
  circle(){[262,330,392,523,659,784,1047,1568].forEach((f,i)=>{tone('triangle',f,f,.5,.1,i*.1);tone('square',f*2,f*2,.2,.03,i*.1)})},
  roar(){tone('sawtooth',110,45,.9,.25);noiz(.9,.3,900,150)}
};
/* --- 칩튠 BGM 시퀀서: 16분음표 스텝, 코드 진행 + 멜로디 + 베이스 + 드럼 --- */
const SONGS={
  town:{bpm:100,lead:'square',lv:.05,ch:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],
    mel:[[76,0,79,0,84,0,79,76],[74,0,79,0,83,0,79,74],[72,0,76,0,81,0,76,72],[72,0,77,0,81,79,77,0],[79,0,76,0,72,0,76,79],[74,0,71,0,67,0,71,74],[76,0,72,0,69,0,72,76],[77,76,72,0,74,0,72,0]]},
  battle:{bpm:152,fast:1,lead:'square',lv:.06,ch:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]],
    mel:[[81,0,81,84,0,83,81,0],[77,0,81,84,0,81,77,0],[79,0,83,86,0,83,79,0],[76,0,80,83,0,80,76,80],[88,0,86,84,0,83,81,0],[84,0,81,77,0,81,84,0],[86,0,83,79,0,83,86,0],[88,86,83,80,83,86,88,0]]},
  boss:{bpm:174,fast:1,lead:'sawtooth',lv:.05,ch:[[57,60,64],[58,62,65],[57,60,64],[52,56,59]],
    mel:[[69,0,69,72,69,0,76,0],[70,0,70,74,70,0,77,0],[69,0,72,76,81,0,76,0],[68,0,71,76,80,0,76,71],[81,0,81,84,81,0,88,0],[82,0,82,86,82,0,89,0],[81,0,84,88,93,0,88,0],[80,0,83,88,92,88,83,80]]}
};
const MU={name:'',song:null,step:0,next:0};
function setMusic(n){if(MU.name===n)return;MU.name=n;MU.song=SONGS[n];MU.step=0;if(AU.ctx)MU.next=AU.ctx.currentTime+.1}
function schedule(){
  const c=AU.ctx;if(!c||!MU.song||c.state!=='running')return;
  const s=MU.song,sp=60/s.bpm/4;if(MU.next<c.currentTime)MU.next=c.currentTime+.05;
  while(MU.next<c.currentTime+.16){playStep(s,MU.step,MU.next,sp);MU.step++;MU.next+=sp}
}
function playStep(s,i,t,sp){
  const bar=i>>4,st=i&15,ch=s.ch[bar%s.ch.length],mel=s.mel[bar%s.mel.length],f=m=>440*Math.pow(2,(m-69)/12),M=AU.mus;
  if(st%2===0){const m=mel[st>>1];if(m)_tone(s.lead,f(m),0,sp*1.9,s.lv,t,M)}
  if(s.fast){
    _tone('square',f(ch[[0,1,2,1][st&3]]+12),0,sp*.9,.022,t,M);
    if(st%2===0)_tone('triangle',f(ch[0]-24+(st%4===2?12:0)),0,sp*1.7,.2,t,M);
    if(st%4===0)_tone('sine',150,40,.12,.32,t,M);
    if(st%8===4)_noiz(.09,.15,6000,2000,t,M,'highpass');
    if(st%2===1)_noiz(.03,.04,9000,9000,t,M,'highpass');
  }else{
    if(st%2===0)_tone('triangle',f(ch[(st>>1)%3]+((st>>1)%4===3?12:0)),0,sp*2.4,.06,t,M);
    if(st===0||st===8)_tone('triangle',f(ch[0]-12),0,sp*7,.15,t,M);
  }
}

/* ============================ PIXEL ART ============================ */
const PAL={k:'#14121f',w:'#ffffff',W:'#d8dee9',g:'#8b93a7',G:'#565c73',d:'#33384d',s:'#f2c9a0',S:'#c98f6b',b:'#3b6cf0',B:'#24409e',c:'#6fd3ff',C:'#2a8fd0',p:'#a45cf0',P:'#63309e',r:'#e5484d',R:'#9b2335',o:'#ff9a3c',O:'#c75f1a',y:'#ffd84a',Y:'#c9972a',e:'#5ed36b',E:'#2f8f4a',n:'#8a5a34',N:'#573620',m:'#ff7ad9',l:'#b8f27a',t:'#3fd9c0',T:'#1f8f86',i:'#eaf6ff',x:'#000000',v:'#e9e2c8',V:'#a89f84'};
function mkSprite(rows,opt={}){
  const map=opt.map||{},ol=opt.outline===false?0:1,h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=mkC(w+ol*2,h+ol*2),g=g2(c);
  const solid=(x,y)=>y>=0&&y<h&&x>=0&&x<rows[y].length&&rows[y][x]!=='.';
  if(ol){g.fillStyle=PAL.k;for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++)if(!solid(x,y)&&(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)))g.fillRect(x+1,y+1,1,1)}

      if(e.cd<=0&&d<190&&fire){e.cd=2.3;ebullet(e.x,e.y-10,Math.atan2(p.y-8-(e.y-10),p.x-e.x),95,e.dmg,'#c04cff');burst(e.x,e.y-10,5,['#c04cff','#ff7ad9'],40,.3);tone('square',500,300,.1,.04)}break}
    case'golem':{e.cd-=dt;if(e.atk>0){e.atk-=dt}else{moveEnt(e,ux*sp*dt,uy*sp*dt,e.r-1);if(d<40&&e.cd<=0&&fire){e.cd=2.6;e.atk=.9;telegraph(e.x,e.y-2,36,.7,e.dmg,'#ff9a3c')}}break}

function minions(e,type,n){for(let i=0;i<n;i++){const a=rnd(TAU);let x=e.x+Math.cos(a)*40,y=e.y+Math.sin(a)*30;if(boxSol(x,y-3,8)){const s=spawnPos(60);x=s.x;y=s.y}spawnMon(type,x,y)}}

/* ============================ ZONES / WAVES ============================ */
function clearWorld(){G.en=[];G.pr=[];G.ep=[];G.parts=[];G.texts=[];G.picks=[];G.fx=[];G.fxNew=[];G.pending=0;G.apoc=0;G.wave=null;G.dead=0}

function fadeTo(fn){const f=$('fade');f.classList.add('on');setTimeout(()=>{fn();setTimeout(()=>f.classList.remove('on'),80)},260)}
function enterTown(){
  clearWorld();G.zone='town';G.floor=0;G.map=TOWN;const p=G.p;p.x=320;p.y=150;p.hp=D.maxHp;p.mp=D.maxMp;p.ifr=0;setLabels();setMusic('town');$('bossBar').hidden=true;updateHUD(true);save();
}
function enterFloor(f){
  clearWorld();G.zone='tower';G.floor=f;G.map=buildFloor(f);const p=G.p,m=G.map;p.x=m.pw/2;p.y=m.ph-70;setLabels();
  const boss=f%5===0,q=[];
  if(boss){const b=BOSSES[((f/5|0)-1)%BOSSES.length];G.wave={q:[],t:1.2,boss:b,bossSp:false,cleared:false};banner(`${f}층 — 보스`,MON[b].name);setMusic('boss')}
  else{const pool=['slime','slime'];if(f>=2)pool.push('bat','bat');if(f>=4)pool.push('skel','skel');if(f>=6)pool.push('mage');if(f>=8)pool.push('golem');if(f>=12)pool.push('skel','mage');
    const n=Math.min(34,5+Math.floor(f*1.6));for(let i=0;i<n;i++)q.push(pick(pool));G.wave={q,t:1.4,cleared:false};banner(`${f}층`,themeOf(f).n);setMusic('battle')}
  $('bossBar').hidden=true;updateHUD(true);
}
function updWave(dt){
  const w=G.wave;if(!w||w.cleared||G.dead)return;w.t-=dt;
  if(w.boss&&!w.bossSp&&w.t<=0){w.bossSp=true;const m=G.map;spawnMon(w.boss,m.pw/2,m.ph/2-20);sfx.roar();shake(5)}
  if(w.q.length&&w.t<=0&&G.en.length+G.pending<14){const n=Math.min(w.q.length,rint(2,4));for(let i=0;i<n;i++){const s=spawnPos(80);spawnMon(w.q.pop(),s.x,s.y)}w.t=1.1}
  if(!w.q.length&&(!w.boss||w.bossSp)&&G.en.length===0&&G.pending===0){
    w.cleared=true;const f=G.floor,bonus=Math.round(10+f*6);S.gold+=bonus;S.maxFloor=Math.max(S.maxFloor,f);qEvent('floor');sfx.clear();banner(`${f}층 클리어!`,`보너스 골드 +${bonus}`);
    const m=G.map;m.inter=[{x:m.pw/2,y:66,r:24,label:`▲ ${f+1}층으로`,pr:'[F] 올라가기',portal:['#6fd3ff','#3b6cf0','#ffffff'],act:()=>{sfx.portal();fadeTo(()=>enterFloor(f+1))}},
      {x:m.pw/2,y:m.ph-44,r:24,label:'마을 귀환',pr:'[F] 돌아가기',portal:['#5ed36b','#b8f27a','#ffffff'],act:()=>{sfx.portal();fadeTo(enterTown)}}];
    setLabels();for(const k of G.picks)k.vac=true;if(w.boss)setMusic('battle');save();
  }
}
function qEvent(type,key){for(const q of S.quests){if(q.done)continue;if(q.type===type&&(type!=='kill'||q.mon===key)){q.cur++;if(q.cur>=q.n){q.cur=q.n;q.done=true;toast(`현상금 달성: ${questText(q)}`);sfx.item()}}}}
function mkQuest(){
  const bf=Math.max(1,S.maxFloor),x=Math.random();let q;
  if(x<.55){const pool=['slime'];if(bf>=2)pool.push('bat');if(bf>=4)pool.push('skel');if(bf>=6)pool.push('mage');if(bf>=8)pool.push('golem');const mon=pick(pool),n=mon==='golem'?rint(3,6):rint(8,18);q={type:'kill',mon,n,gold:40+n*(5+bf*2),ess:2+(n/4|0)}}
  else if(x<.85){const n=rint(2,4);q={type:'floor',n,gold:50+n*(25+bf*8),ess:3+n}}
  else q={type:'boss',n:1,gold:200+bf*30,ess:10,ore:8};
  q.cur=0;q.done=false;q.xp=Math.round(xpNeed(S.lvl)*.3);return q;
}
const questText=q=>q.type==='kill'?`${MON[q.mon].name} ${q.n}마리 처치`:q.type==='floor'?`탑 ${q.n}개 층 클리어`:'탑의 보스 처치';

/* ============================ UPDATE ============================ */
function tryInteract(){if(ui.open||G.dead)return;const p=G.p;let b=null,bd=1e9;for(const it of G.map.inter){const d=Math.hypot(it.x-p.x,it.y-p.y);if(d<it.r+12&&d<bd){bd=d;b=it}}if(b){sfx.ui();b.act()}}
function updPlayer(dt){
  const p=G.p,k=IN.keys;let mx=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0)+IN.jx,my=(k.KeyS||k.ArrowDown?1:0)-(k.KeyW||k.ArrowUp?1:0)+IN.jy;
  const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}p.mvx=l>.1?mx/Math.max(l,.001)*Math.min(l,1):0;p.mvy=l>.1?my/Math.max(l,.001)*Math.min(l,1):0;
  if(l>.1){moveEnt(p,mx*82*dt,my*82*dt,4);p.walk+=dt*9;if(IN.touch&&Math.abs(mx)>.2)p.face=mx<0?-1:1}else p.walk=0;
  if(!IN.touch){const wx=IN.mx+G.cam.x;if(Math.abs(wx-p.x)>3)p.face=wx<p.x?-1:1}
  p.hp=Math.min(D.maxHp,p.hp+D.hpR*dt);p.mp=Math.min(D.maxMp,p.mp+D.mpR*dt);
  for(const id in p.cd)if(p.cd[id]>0)p.cd[id]-=dt;p.mcd-=dt;p.bcd-=dt;p.pcd-=dt;p.ifr-=dt;p.castT-=dt;
  const auto=IN.touch&&G.zone==='tower'&&nearestEnemy(p.x,p.y,170);
  if((IN.down||auto)&&p.mcd<=0)shoot();
}
function update(dt){
  G.time+=dt;const p=G.p;
  if(G.dead>0){G.dead-=dt;if(G.dead<=0){G.dead=0;fadeTo(enterTown)}}
  else updPlayer(dt);
  if(G.zone==='tower')updWave(dt);
  for(const e of G.en)if(!e.dead)updEnemy(e,dt);
  // 서로 밀어내기
  for(let i=0;i<G.en.length;i++){const a=G.en[i];if(a.frozen>0||a.boss)continue;for(let j=i+1;j<G.en.length;j++){const b=G.en[j];if(b.boss)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d<m&&d>.01){const o=(m-d)/2*.5,ux=dx/d,uy=dy/d;moveEnt(a,-ux*o,-uy*o,a.r-2);if(!(b.frozen>0))moveEnt(b,ux*o,uy*o,b.r-2)}}}
  // 플레이어 투사체
  G.pr=G.pr.filter(b=>{
    b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.kind==='fire'){for(let i=0;i<2;i++)part(b.x+rnd(-2,2),b.y+rnd(-2,2),rnd(-12,12)-b.vx*.1,rnd(-12,12)-b.vy*.1,rnd(.15,.4),pick(['#ffd84a','#ff9a3c','#e5484d']),Math.random()<.4?2:1)}
    else if(Math.random()<.8)part(b.x,b.y,rnd(-8,8),rnd(-8,8),.2,pick(['#c04cff','#6fd3ff','#ffffff']),1);
    let hit=b.life<=0||solAt(b.x,b.y+4);let he=null;
    if(!hit)for(const e of G.en){if(e.dead)continue;if(Math.hypot(e.x-b.x,e.y-e.r-e.z-b.y)<e.r+b.r+1){hit=true;he=e;break}}
    if(!hit)return true;
    if(b.kind==='fire'){aoe(b.x,b.y,30,b.dmg,{kb:110});boomFx(b.x,b.y,28,['#ffd84a','#ff9a3c','#e5484d']);decal(b.x,b.y+3,10,'#0b0818',2);shake(4);sfx.boom()}
    else{if(he)hurt(he,b.dmg,{kb:70,sx:b.x-b.vx,sy:b.y-b.vy});burst(b.x,b.y,6,['#c04cff','#6fd3ff','#ffffff'],60,.25)}
    return false});
  // 적 투사체
  G.ep=G.ep.filter(b=>{b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.life<=0||solAt(b.x,b.y)){burst(b.x,b.y,4,[b.col],40,.2);return false}
    if(Math.hypot(p.x-b.x,p.y-8-b.y)<b.r+5&&!G.dead){if(p.ifr<=0){hurtPlayer(b.dmg);return false}}return true});
  G.en=G.en.filter(e=>!e.dead);
  // 드랍
  G.picks=G.picks.filter(k=>{
    k.t+=dt;k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx*=Math.pow(.01,dt);k.vy*=Math.pow(.01,dt);
    const dx=p.x-k.x,dy=p.y-6-k.y,d=Math.hypot(dx,dy)||1,mr=k.vac?9999:k.kind==='xp'?64:38;
    if(k.t>.35&&d<mr&&!G.dead){const s=Math.min(320,140+k.t*120);k.x+=dx/d*s*dt;k.y+=dy/d*s*dt}
    if(k.t>.35&&d<9&&!G.dead){
      if(k.kind==='xp'){gainXp(k.val);sfx.gem()}
      else if(k.kind==='gold'){S.gold+=k.val;sfx.coin();G.texts.push({x:p.x,y:p.y-30,vy:-20,life:.6,str:'+'+k.val,col:'#ffd84a',sc:1})}
      else if(k.kind==='heart'){p.hp=Math.min(D.maxHp,p.hp+D.maxHp*.2);sfx.potion()}
      else if(k.kind==='item'){if(S.inv.length>=32){const g=sellPrice(k.item);S.gold+=g;toast(`가방이 가득 차 ${itemName(k.item)} 자동 판매 (+${g})`)}else{S.inv.push(k.item);toast(`획득: <span style="color:${RAR[k.item.r].c}">[${RAR[k.item.r].n}] ${itemName(k.item)}</span>`)}sfx.item()}
      else{S[k.kind]+=k.val;sfx.coin();if(k.kind==='core')toast('서클 코어를 획득했습니다!')}
      return false}
    return true});
  // 파티클
  let n=0;const ps=G.parts;for(let i=0;i<ps.length;i++){const q=ps[i];q.life-=dt;if(q.life<=0)continue;if(q.drag){const f=Math.max(0,1-q.drag*dt);q.vx*=f;q.vy*=f}q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;ps[n++]=q}ps.length=n;
  G.texts=G.texts.filter(t=>{t.life-=dt;t.y+=t.vy*dt;t.vy*=Math.pow(.05,dt);return t.life>0});
  G.fx=G.fx.filter(f=>f.upd(dt)!==false);if(G.fxNew.length){G.fx.push(...G.fxNew);G.fxNew.length=0}
  if(G.apoc>0)G.apoc-=dt;
  G.shake=Math.max(0,G.shake-dt*22);if(G.flash>0)G.flash-=dt;
}

/* ============================ RENDER ============================ */
const LGc=mkC(W,H),LG=g2(LGc);

function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.32)';w=Math.round(w);ctx.fillRect(Math.round(x-w/2)+1,Math.round(y)-1,w-2,1);ctx.fillRect(Math.round(x-w/2),Math.round(y),w,2);ctx.fillRect(Math.round(x-w/2)+1,Math.round(y)+2,w-2,1)}
function drawEnemy(e){
  const mode=e.frozen>0?'i':e.flash>0?'w':'';let spr=e.spr,sqx=1,sqy=1;
  if(e.type==='bat')spr=A.bat[(e.t*10|0)%2];
  if(e.type==='slime'||e.type==='kingslime'){const s=e.frozen>0?0:Math.sin(e.t*9)*.1;sqx=1+s;sqy=1-s;if(e.z>4){sqx=.9;sqy=1.12}}
  shadow(e.x,e.y,(spr.W*e.sc)*(e.z>10?.6:.9));

      for(const it of S.inv)h+=`<div class="cell ${ui.sel===it.id?'sel':''}" style="box-shadow:0 0 0 .14em ${RAR[it.r].c}" data-a="sel:${it.id}"><img src="${ICON[it.slot]}" alt="">${it.up?`<u>+${it.up}</u>`:''}</div>`;
      for(let i=S.inv.length;i<32;i++)h+='<div class="cell" style="cursor:default"></div>';
      h+=`</div><div class="row">${btn('일반·고급 모두 판매','sellJunk',S.inv.some(i=>i.r<2))}</div></div><div>`;
      const eqd=Object.values(S.eq).find(i=>i&&i.id===ui.sel),it=eqd||S.inv.find(i=>i.id===ui.sel);
      if(it){const cur=S.eq[it.slot];h+=`<b style="color:${RAR[it.r].c}">[${RAR[it.r].n}] ${itemName(it)}</b><br><span class="dim">아이템 레벨 ${it.il}</span><br>${statLine(it).split(' · ').join('<br>')}<br>`;
        if(eqd)h+=`<div class="row">${btn('해제','unequip:'+it.slot,S.inv.length<32)}</div>`;
        else{if(cur)h+=`<p>현재 장착: <span style="color:${RAR[cur.r].c}">${itemName(cur)}</span><br>${statLine(cur)}</p>`;h+=`<div class="row">${btn('장착','equip:'+it.id,true,'go')} ${btn(`판매 (+${sellPrice(it)})`,'sell:'+it.id)}</div>`}}
      else h+='<p>아이템을 누르면 정보가 보입니다.<br>테두리 색 = 등급<br><span style="color:#c9c9d6">일반</span> <span style="color:#5ed36b">고급</span> <span style="color:#4aa3ff">희귀</span> <span style="color:#c04cff">영웅</span> <span style="color:#ffb02e">전설</span></p>';
      h+='</div></div>'}
    else h+=grimList(false);
    return h}}
};
function grimList(shop){
  let h=`<p>마법 슬롯 ${S.slots.slice(0,D.slots).filter(Boolean).length}/${D.slots}칸 사용 중. ${shop?'':'제작과 강화는 연금술사 루나에게.'}</p>`;
  for(const id of SPELL_IDS){const sp=SPELLS[id],lv=S.grim[id]||0,eq=S.slots.indexOf(id)>=0&&S.slots.indexOf(id)<D.slots;
    h+=`<div class="card"><img class="ci" src="${ICON[id]}" alt=""><div class="gr"><b>${sp.name}</b> ${lv?`<span class="gold">Lv.${lv}</span>`:`<span class="dim">(${sp.circle}서클 필요)</span>`} <span class="dim">마나 ${sp.mp} · 쿨 ${sp.cd}초</span><br><span class="dim">${sp.desc}</span>`;
    if(shop){if(!lv)h+=`<br>제작: ${costHTML(sp.cost)}`;else if(lv<10){const ec=enhCost(id);h+=`<br>강화(피해 +15%): ${costHTML(ec)}`}}
    h+='</div><div>';
    if(lv)h+=btn(eq?'해제':'장착','slot:'+id,true,eq?'':'go');
    if(shop){if(!lv)h+=btn('제작','craft:'+id,S.circle>=sp.circle&&can(sp.cost),'go');else if(lv<10)h+='<br>'+btn('강화','enh:'+id,can(enhCost(id)))}
    h+='</div></div>'}
  return h;
}
const enhCost=id=>{const lv=S.grim[id],t=SPELLS[id].circle;return{gold:Math.round(50*Math.pow(lv,1.6)*(1+t*.5)),ess:3*lv+t*2}};
const ACT={
  stat(k){if(S.pts>0){S.pts--;S.st[k]++;recalc();sfx.ui()}},
  circle(){const c=S.circle,r=CIRC[c];if(!r||S.lvl<r.lvl)return sfx.err();if(!pay(r.cost))return;S.circle++;recalc();G.p.mp=D.maxMp;sfx.circle();banner(`${S.circle}서클 달성!`,'새로운 마나의 고리가 심장에 새겨졌습니다');levelFx();G.flash=.3;G.flashCol=AURA[S.circle];renderSkillBar();closePanel()},
  craft(id){const sp=SPELLS[id];if(S.circle<sp.circle){toast(`${sp.circle}서클이 필요합니다`);return sfx.err()}if(!pay(sp.cost))return;S.grim[id]=1;sfx.buy();toast(`마법서 제작: ${sp.name}`);const i=S.slots.slice(0,D.slots).indexOf(null);if(i>=0)S.slots[i]=id;renderSkillBar()},
  enh(id){if(S.grim[id]>=10)return;if(!pay(enhCost(id)))return;S.grim[id]++;sfx.buy();toast(`${SPELLS[id].name} Lv.${S.grim[id]}`)},
  slot(id){const i=S.slots.indexOf(id);if(i>=0&&i<D.slots)S.slots[i]=null;else{if(i>=0)S.slots[i]=null;const j=S.slots.slice(0,D.slots).indexOf(null);if(j<0){toast('빈 슬롯이 없습니다. 다른 마법을 먼저 해제하세요');return sfx.err()}S.slots[j]=id}sfx.ui();renderSkillBar()},
  ltab(t){ui.lunaTab=t;sfx.ui()},tab(t){ui.tab=t;sfx.ui()},
  pot(k){const key=k+'Pot';if(S[key]>=9)return sfx.err();if(!pay({gold:20,ess:1}))return;S[key]++;sfx.buy();renderSkillBar()},
  potg(k){const key=k+'Pot';if(S[key]>=9)return sfx.err();if(!pay({gold:45}))return;S[key]++;sfx.buy();renderSkillBar()},
  forge(slot){if(S.inv.length>=32){toast('가방이 가득 찼습니다');return sfx.err()}const il=Math.max(1,S.maxFloor);if(!pay({gold:80+il*20,ore:4+(il>>1)}))return;const it=mkItem(il,1,slot);S.inv.push(it);sfx.buy();tone('square',1400,1400,.05,.08,.15);toast(`제작 완료: <span style="color:${RAR[it.r].c}">[${RAR[it.r].n}] ${itemName(it)}</span>`)},
  reinf(k){const it=S.eq[k];if(!it||it.up>=10)return;if(!pay({gold:40*(it.up+1)*(it.r+1),ore:2*(it.up+1)}))return;it.up++;recalc();sfx.buy();noiz(.08,.2,4000,1500)},
  tier(k){const it=S.eq[k];if(!it||it.r>=4)return;if(!pay({gold:300*(it.r+1)*(it.r+1),ore:15*(it.r+1),ess:10*(it.r+1)}))return;it.r++;const[a,v]=rollAffix(it.il,it.r);it.a[a]=Math.round(((it.a[a]||0)+v)*10)/10;recalc();sfx.circle();toast(`등급 승급! <span style="color:${RAR[it.r].c}">[${RAR[it.r].n}] ${itemName(it)}</span>`)},
  sel(id){ui.sel=+id;sfx.ui()},
  equip(id){const i=S.inv.findIndex(x=>x.id===+id);if(i<0)return;const it=S.inv[i],old=S.eq[it.slot];S.inv.splice(i,1);if(old)S.inv.push(old);S.eq[it.slot]=it;recalc();sfx.buy()},
  unequip(k){const it=S.eq[k];if(!it||S.inv.length>=32)return;S.eq[k]=null;S.inv.push(it);recalc();sfx.ui()},
  sell(id){const i=S.inv.findIndex(x=>x.id===+id);if(i<0)return;S.gold+=sellPrice(S.inv[i]);S.inv.splice(i,1);ui.sel=null;sfx.coin()},
  sellJunk(){let g=0;S.inv=S.inv.filter(it=>{if(it.r<2){g+=sellPrice(it);return false}return true});S.gold+=g;if(g){sfx.coin();toast(`골드 +${g}`)}},
  claim(i){const q=S.quests[+i];if(!q||!q.done)return;S.gold+=q.gold;S.ess+=q.ess;S.ore+=q.ore||0;S.quests.splice(+i,1);S.quests.push(mkQuest());sfx.clear();gainXp(q.xp)},
  enter(f){closePanel();sfx.portal();fadeTo(()=>enterFloor(+f))},
  reset(){if(ui.resetArm){try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}else{ui.resetArm=true;toast('한 번 더 누르면 저장이 삭제됩니다')}}
};
function openPanel(n){ui.open=n;ui.sel=null;ui.resetArm=false;IN.down=false;$('panel').hidden=false;refreshPanel()}
function refreshPanel(){if(!ui.open)return;const P=PANELS[ui.open];$('panelTitle').textContent=P.t;$('panelBody').innerHTML=P.r()}
function closePanel(){ui.open=null;$('panel').hidden=true}

/* ============================ INPUT ============================ */
function bindInput(){
  addEventListener('keydown',e=>{
    if(!G.started)return;if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat&&!/^Digit/.test(e.code))return;IN.keys[e.code]=true;
    if(ui.open){if(e.code==='Escape'||e.code==='Tab'||e.code==='KeyF'||e.code==='KeyI')closePanel();return}
    const m=/^Digit([1-6])$/.exec(e.code);if(m){const id=S.slots[+m[1]-1];if(id&&+m[1]<=D.slots)cast(id)}
    else if(e.code==='KeyF')tryInteract();else if(e.code==='Space')blink();else if(e.code==='KeyQ')usePot('hp');else if(e.code==='KeyE')usePot('mp');
    else if(e.code==='Tab'||e.code==='KeyI'||e.code==='KeyC')openPanel('char');else if(e.code==='KeyL')toggleScan();else if(e.code==='KeyM')toggleMute();
  });
  addEventListener('keyup',e=>{IN.keys[e.code]=false});
  addEventListener('blur',()=>{IN.keys={};IN.down=false});
  const pos=e=>{const r=cv.getBoundingClientRect();IN.mx=(e.clientX-r.left)/r.width*W;IN.my=(e.clientY-r.top)/r.height*H};
  cv.addEventListener('mousemove',e=>{IN.touch=false;pos(e)});
  cv.addEventListener('mousedown',e=>{if(e.button)return;pos(e);IN.touch=false;const wx=IN.mx+G.cam.x,wy=IN.my+G.cam.y,p=G.p;
    for(const it of G.map.inter)if(Math.hypot(it.x-wx,it.y-10-wy)<18&&Math.hypot(it.x-p.x,it.y-p.y)<it.r+12){sfx.ui();it.act();return}IN.down=true});
  addEventListener('mouseup',()=>{IN.down=false});cv.addEventListener('contextmenu',e=>e.preventDefault());
  // 터치: 왼쪽 = 조이스틱, 미사일은 가까운 적에게 자동 발사
  const joy=$('joy'),jk=$('joyK');let jo=null;
  cv.addEventListener('touchstart',e=>{e.preventDefault();if(!IN.touch){IN.touch=true;$('touch').style.display='block'}for(const t of e.changedTouches){if(IN.jid===null){IN.jid=t.identifier;jo={x:t.clientX,y:t.clientY};const r=$('stage').getBoundingClientRect();joy.style.display='block';joy.style.left=(t.clientX-r.left)+'px';joy.style.top=(t.clientY-r.top)+'px';jk.style.transform=''}}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===IN.jid){let dx=t.clientX-jo.x,dy=t.clientY-jo.y;const d=Math.hypot(dx,dy),mx=44;if(d>mx){dx=dx/d*mx;dy=dy/d*mx}IN.jx=dx/mx;IN.jy=dy/mx;jk.style.transform=`translate(${dx}px,${dy}px)`}},{passive:false});
  const tend=e=>{for(const t of e.changedTouches)if(t.identifier===IN.jid){IN.jid=null;IN.jx=IN.jy=0;joy.style.display='none'}};
  cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
  $('tF').onclick=tryInteract;$('tB').onclick=blink;
  $('skills').addEventListener('click',e=>{const el=e.target.closest('.sk');if(!el)return;const d=el.dataset;if(d.s)cast(d.s,true);else if(d.p)usePot(d.p);else if(d.b)blink()});
  $('panelBody').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const i=t.dataset.a.indexOf(':'),a=i<0?t.dataset.a:t.dataset.a.slice(0,i),arg=i<0?undefined:t.dataset.a.slice(i+1);if(ACT[a]){ACT[a](arg);refreshPanel();updateHUD(true);save()}});
  $('panelX').onclick=closePanel;$('panel').addEventListener('mousedown',e=>{if(e.target===$('panel'))closePanel()});
  $('bBag').onclick=()=>openPanel('char');$('bScan').onclick=toggleScan;$('bSnd').onclick=toggleMute;
}
function toggleScan(){S.scan=!S.scan;$('scan').classList.toggle('off',!S.scan);$('bScan').classList.toggle('off',!S.scan);save()}
function toggleMute(){S.mute=!S.mute;if(AU.master)AU.master.gain.value=S.mute?0:.8;$('bSnd').classList.toggle('off',S.mute);save()}
function resize(){const st=$('stage');let s=Math.min(innerWidth/W,innerHeight/H);if(s>=2)s=Math.floor(s);st.style.width=W*s+'px';st.style.height=H*s+'px';st.style.fontSize=Math.max(1.6,s)*4+'px';st.style.setProperty('--px',Math.max(2,s)+'px')}

/* ============================ BOOT ============================ */
let TOWN,lastT=0,hudTick=0;
function frame(t){
  requestAnimationFrame(frame);let dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;if(!G.started)return;
  if(G.hitstop>0){G.hitstop-=dt;dt=0}
  if(!ui.open&&dt>0)update(dt);
  render();if(++hudTick%3===0)updateHUD();
}
function start(fresh){
  if(fresh)S=newSave();initAudio();if(AU.master)AU.master.gain.value=S.mute?0:.8;
  G.p={x:320,y:150,hp:1,mp:1,face:1,walk:0,ifr:0,cd:{},mcd:0,bcd:0,pcd:0,castT:0,mvx:0,mvy:0};recalc();G.p.hp=D.maxHp;G.p.mp=D.maxMp;
  while(S.quests.length<3)S.quests.push(mkQuest());
  $('scan').classList.toggle('off',!S.scan);$('bScan').classList.toggle('off',!S.scan);$('bSnd').classList.toggle('off',S.mute);
  $('title').hidden=true;$('hud').hidden=false;renderSkillBar();enterTown();G.started=true;
  toast('북쪽 <b class="gold">심연의 탑</b>으로 가서 [F]를 누르세요');toast('마을 사람들에게 [F]로 말을 걸어 보세요');
}
function drawTitleArt(){const c=$('titleArt'),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(A.lich.n,0,0,24,28,56,2,36,42);g.drawImage(A.player[0].n,4,22);g.drawImage(A.slime[0].n,26,30);g.drawImage(A.golem.n,38,25);g.drawImage(A.g_fireball,6,4);g.drawImage(A.g_chain,22,2);g.drawImage(A.g_frost,38,4)}
buildAssets();TOWN=null;
(function boot(){
  const sv=loadSave();if(sv){S=sv;$('bCont').hidden=false}
  resize();addEventListener('resize',resize);
  G.map={inter:[]};TOWN=buildTown();bindInput();drawTitleArt();
  $('bNew').onclick=()=>start(true);$('bCont').onclick=()=>start(false);
  setInterval(()=>{if(G.started)save()},20000);
  requestAnimationFrame(frame);
})();
window.__game={recalc,renderSkillBar,G,get S(){return S},D,enterFloor,enterTown,cast,openPanel,closePanel,start};
</script>
